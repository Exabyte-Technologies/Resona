name: Security Scan

# Supply-chain / dependency vulnerability scanning.
# Runs independently of deploy.yml so that adding this security gate can
# never block or break a production deployment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly audit: catches newly-disclosed CVEs even when no code changes land.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Required to upload SARIF results to the code-scanning dashboard.
  security-events: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit pinned dependencies with pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # requirements.txt pins exact versions, so the audit is deterministic.
          inputs: requirements.txt
          summary: true
          # Publishes results to the GitHub Security tab (code scanning).
          upload-sarif: true
