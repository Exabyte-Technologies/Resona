name: Deploy Resona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resona-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 157.245.192.56
      DEPLOY_USER: resonahost
      APP_DIR: /opt/resona
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOSEAI_API_KEY: ${{ secrets.CLOSEAI_API_KEY }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test application
        run: |
          python3 -m venv /tmp/resona-test-venv
          /tmp/resona-test-venv/bin/python -m pip install --upgrade pip
          /tmp/resona-test-venv/bin/python -m pip install --requirement requirements.txt
          /tmp/resona-test-venv/bin/python -m pytest -q
          /tmp/resona-test-venv/bin/python -m pip check

      - name: Verify runner dependencies
        run: |
          missing=()
          for command in ssh ssh-keyscan rsync python3; do
            command -v "$command" >/dev/null 2>&1 || missing+=("$command")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y openssh-client rsync python3
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY secret" >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Render production environment
        run: |
          test -n "$LETSENCRYPT_EMAIL" || { echo "Missing LETSENCRYPT_EMAIL secret" >&2; exit 1; }
          [[ "$LETSENCRYPT_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "LETSENCRYPT_EMAIL is not a valid email address" >&2; exit 1; }
          python3 deploy/render_env.py /tmp/resona-production.env

      - name: Bootstrap Ubuntu host
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo bash -s -- "$DEPLOY_USER" "$APP_DIR" < deploy/bootstrap-ubuntu.sh

      - name: Sync application without persistent data
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='instance/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"
          rsync -az --chmod=F600 /tmp/resona-production.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/resona-production.env"
          rm -f /tmp/resona-production.env

      - name: Install dependencies and restart services
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo bash "$APP_DIR/deploy/finalize-ubuntu.sh" "$DEPLOY_USER" "$APP_DIR" /tmp/resona-production.env "$LETSENCRYPT_EMAIL"
