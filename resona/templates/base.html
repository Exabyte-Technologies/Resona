<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111510">
  <title>{% block title %}Resona{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ url_for('static', filename='favicon-256.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/captcha.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/capjs/cap.min.js') }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='vendor/disable-devtool/disable-devtool.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/devtool-protection.js') }}"></script>
</body>
</html>
